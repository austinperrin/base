name: Scheduled Credential Scan

on:
  schedule:
    # Weekly on Monday at 04:23 UTC, away from the top of the hour.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    name: Scheduled credential scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: |
          python3 scripts/ci/install-tools.py --platform linux-amd64 --tool gitleaks --destination "$RUNNER_TEMP/repository-tools"
          echo "$RUNNER_TEMP/repository-tools" >> "$GITHUB_PATH"
      - name: Scan credentials with redacted output
        run: ./scripts/ci/check-credentials.sh
      - name: Verify the checkout is unchanged
        run: test -z "$(git status --porcelain --untracked-files=all)"
