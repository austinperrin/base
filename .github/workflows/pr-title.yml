name: Pull Request Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Validate Conventional Commit PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate title from event metadata
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import sys

          try:
            with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as source:
              title = json.load(source)['pull_request']['title']
          except (OSError, ValueError, KeyError, TypeError):
            sys.exit('::error::Could not read the pull request title from event metadata.')

          pattern = r'(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()\s]+\))?!?: [^\s].*'
          if (not isinstance(title, str)
              or any(ord(char) < 32 or ord(char) == 127 for char in title)
              or not re.fullmatch(pattern, title)):
            sys.exit('::error::Use a Conventional Commits title; see docs/standards/git-workflow.md.')
          print('Pull request title follows the repository commit convention.')
          PYTHON
